<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaaStoAgent ToolRouter Sandbox</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header>
          <p class="eyebrow">OpenAPI ToolRouter</p>
          <h1>Sandbox routing and output-based training</h1>
        </header>
        <label class="field">
          <span>User goal</span>
          <textarea id="query" rows="5">list products</textarea>
        </label>
        <div class="grid">
          <label class="field">
            <span>Tenant</span>
            <input id="tenant" value="sandbox-tenant" />
          </label>
          <label class="field">
            <span>Integration</span>
            <input id="integration" value="medusa" />
          </label>
          <label class="field">
            <span>Guardrail mode</span>
            <select id="mode">
              <option value="suggest">suggest</option>
              <option value="dry_run">dry_run</option>
              <option value="auto_read">auto_read</option>
              <option value="confirm_write">confirm_write</option>
              <option value="block_write">block_write</option>
              <option value="observe">observe</option>
            </select>
          </label>
        </div>
        <fieldset>
          <legend>Sandbox account</legend>
          <div class="grid">
            <label class="field">
              <span>Username</span>
              <input id="username" autocomplete="off" />
            </label>
            <label class="field">
              <span>Password</span>
              <input id="password" type="password" autocomplete="off" />
            </label>
            <label class="check">
              <input id="signup" type="checkbox" />
              <span>Agent may sign up for a sandbox account</span>
            </label>
          </div>
        </fieldset>
        <div class="actions">
          <button id="route">Route</button>
          <button id="positive">Mark selected as correct</button>
          <button id="reject">Reject top candidate</button>
        </div>
      </section>
      <aside class="result">
        <h2>Decision</h2>
        <pre id="output">No decision yet.</pre>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
