services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saastoagent_v0_1
    ports:
      - "5435:5432"
    volumes:
      - saastoagent_v0_1_pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STA_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/saastoagent_v0_1
      STA_AUTH_SECRET: dev-secret-change-in-prod
      STA_AUTH_TOKEN_LIFETIME_SECONDS: 31536000
      STA_CORS_ORIGINS: '["http://localhost:3005"]'
    ports:
      - "8085:8000"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  saastoagent_v0_1_pgdata18:
