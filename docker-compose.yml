services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saastoagent_v0_1
      PGDATA: /var/lib/postgresql/data/pgdata
    # No host port binding; backend accesses db via Docker DNS (db:5432).
    # Avoids port 5435 conflict with the sibling saastoagent project.
    volumes:
      - saastoagent_v0_1_pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STA_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/saastoagent_v0_1
      STA_AUTH_SECRET: ${STA_AUTH_SECRET:-dev-secret-change-in-prod}
      STA_AUTH_TOKEN_LIFETIME_SECONDS: 31536000
      STA_CORS_ORIGINS: '["http://localhost:3007"]'
      STA_OPENAI_API_KEY: ${STA_OPENAI_API_KEY:-}
      STA_DEFAULT_MODEL: ${STA_DEFAULT_MODEL:-gpt-5-mini}
      STA_EMBEDDING_MODEL: ${STA_EMBEDDING_MODEL:-text-embedding-3-small}
      STA_UPLOAD_DIR: /app/uploads
    ports:
      - "8085:8000"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./routedeck_framework:/app/routedeck_framework
      - sta_v01_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run build && npm run preview"
    ports:
      - "3007:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - ./routedeck_framework:/routedeck_framework
      - /app/node_modules

volumes:
  saastoagent_v0_1_pgdata17:
  sta_v01_uploads:
