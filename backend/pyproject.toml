[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "corpus-app"
version = "0.1.0"
description = "Corpus product host and Workspace feature for RouteDeck."
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "email-validator==2.3.0",
    "fastapi-users[sqlalchemy]==15.0.5",
    "fastapi-users-db-sqlalchemy==7.0.0",
    "jsonschema==4.26.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.3.5",
    "numpy==2.4.6",
    "ollama==0.6.2",
    "openapi-core==0.22.0",
    "openapi-spec-validator==0.7.2",
    "prance[osv]==25.4.8.0",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "routedeck-core[fastapi,langgraph,persistence]==0.1.0",
    "sentence-transformers==5.6.0",
    "sqlalchemy==2.0.51",
    "torch==2.13.0",
]

[project.optional-dependencies]
testing = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
evaluation = [
    "playwright==1.62.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
