<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create an agent surface</title>
  <style>
    :root { color-scheme: light dark; --stage: #f7f9fc; --surface: #ffffff; --text: #172033; --muted: #667085; --border: #dce2eb; --input: #cbd4e1; --accent: #2563eb; --accent-text: #ffffff; --shadow: rgba(37, 55, 87, .07); }
    @media (prefers-color-scheme: dark) { :root { --stage: #111113; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46; --input: #52525b; --accent: #39ff14; --accent-text: #111113; --shadow: rgba(0, 0, 0, .3); } }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; padding: 2px 2px 18px; font-family: Arial, sans-serif; color: var(--text); background: transparent; }
    .surface { width: 100%; padding: 0; background: transparent; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .intro { margin: 8px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 600; }
    input, textarea { width: 100%; border: 1px solid var(--input); border-radius: 9px; padding: 10px 11px; color: var(--text); background: var(--surface); font: inherit; }
    textarea { min-height: 100px; resize: none; }
    .field + .field { margin-top: 17px; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
    button { border: 1px solid var(--input); border-radius: 9px; padding: 9px 13px; color: var(--text); background: var(--surface); font-weight: 600; }
    .primary { border-color: var(--accent); color: var(--accent-text); background: var(--accent); }
    @media (max-width: 460px) { body { padding: 2px 2px 14px; } }
  </style>
</head>
<body>
  <section class="surface" aria-label="Create agent surface">
    <h1>Create an agent</h1>
    <p class="intro">Define the agent's identity. Creating it does not create a runnable version or deployment.</p>
    <div class="field">
      <label for="name">Agent name</label>
      <input id="name" value="Support Knowledge Agent" readonly />
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" readonly>Helps support leads answer recurring customer order questions.</textarea>
    </div>
    <div class="field">
      <label for="goal">Goal</label>
      <textarea id="goal" readonly>Give support leads accurate order-status and shipment-tracking answers.</textarea>
      <p class="hint">Name, description, and goal are required to create the agent.</p>
    </div>
    <div class="actions"><button type="button">Cancel</button><button class="primary" type="button">Create agent</button></div>
  </section>
  <script src="/mock-surfaces/surface-height.js"></script>
</body>
</html>
